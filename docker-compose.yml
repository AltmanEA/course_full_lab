version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: course_full_lab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lab_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  lab_next:
    build:
      context: .
      dockerfile: Dockerfile.lab_next
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - lab_next_node_modules:/app/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      NODE_ENV: development
      DATABASE_URL: "postgresql://postgres:password@postgres:5432/course_full_lab"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      NEXT_WEBPACK_USEPOLLING: "1"
      # Другие переменные из .env можно добавить через env_file
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lab_network
    command: npm run dev
    restart: unless-stopped

  playwright:
    build:
      context: .
      dockerfile: Dockerfile.playwright
    volumes:
      - .:/app
      - playwright_node_modules:/app/node_modules
    networks:
      - lab_network
    command: tail -f /dev/null
    restart: unless-stopped

volumes:
  lab_next_node_modules:
  playwright_node_modules:
  postgres_data:

networks:
  lab_network:
    driver: bridge